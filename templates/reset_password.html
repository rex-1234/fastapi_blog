{% extends "layout.html" %} {% block title %}Reset Password · FastAPI Blog{%
endblock %} {% block content %}
<div class="container" style="max-width: 720px">
  <div class="post-card p-4">
    <h2 class="mb-3">Reset Password</h2>
    <p class="text-muted small mb-4">Enter your new password below.</p>

    <form id="resetPasswordForm">
      <div class="mb-3">
        <label for="newPassword" class="form-label">New Password</label>
        <input
          type="password"
          class="form-control rounded-3"
          id="newPassword"
          name="new_password"
          required
          minlength="8"
          autofocus
        />
        <div class="form-text">Password must be at least 8 characters.</div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">
          Confirm New Password
        </label>
        <input
          type="password"
          class="form-control rounded-3"
          id="confirmPassword"
          name="confirm_password"
          required
          minlength="8"
        />
      </div>

      <button
        type="submit"
        class="btn btn-dark rounded-pill px-4"
        id="submitBtn"
      >
        Reset Password
      </button>
    </form>

    <hr class="my-4" />

    <p class="mb-0 small text-muted">
      Remember your password?
      <a href="{{ url_for('login_page') }}" class="text-decoration-none">
        Login here
      </a>
    </p>
  </div>
</div>
{% endblock %} {% block scripts %}
<script type="module">
  import { getErrorMessage, showModal } from "/static/js/utils.js";

  // Extract token from URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token");

  const resetPasswordForm = document.getElementById("resetPasswordForm");
  const submitBtn = document.getElementById("submitBtn");

  // Handle missing token
  if (!token) {
    document.getElementById("errorMessage").textContent =
      "Invalid or missing reset token. Please request a new password reset.";
    showModal("errorModal");
    submitBtn.disabled = true;
  }

  resetPasswordForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      document.getElementById("errorMessage").textContent =
        "Passwords do not match.";
      showModal("errorModal");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting...";

    try {
      const response = await fetch("/api/users/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token: token,
          new_password: newPassword,
        }),
      });

      if (response.ok) {
        document.getElementById("successMessage").textContent =
          "Password reset successfully! You can now log in.";
        showModal("successModal");

        document.getElementById("successModal").addEventListener(
          "hidden.bs.modal",
          () => {
            window.location.href = "/login";
          },
          { once: true },
        );
      } else {
        const error = await response.json();
        document.getElementById("errorMessage").textContent =
          getErrorMessage(error);

        if (response.status === 400) {
          document.getElementById("errorMessage").textContent +=
            " Please request a new reset link.";
        }

        showModal("errorModal");
      }
    } catch (error) {
      document.getElementById("errorMessage").textContent =
        "Network error. Please try again.";
      showModal("errorModal");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset Password";
    }
  });
</script>
{% endblock %}
