<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}FastAPI Blog{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/main.css') }}"
    />

    <!-- Apple-style icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ url_for('static', path='icons/apple-touch-icon.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', path='icons/favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', path='icons/favicon-16x16.png') }}"
    />

    <link
      rel="manifest"
      href="{{ url_for('static', path='site.webmanifest') }}"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm py-2">
      <div class="container">
        <!-- Brand -->
        <a class="navbar-brand fw-bold me-4" href="/"> FastAPI Blog </a>

        <!-- Mobile Toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- LEFT SIDE -->
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/posts">Posts</a>
            </li>
          </ul>

          <!-- RIGHT SIDE -->
          <ul class="navbar-nav ms-auto align-items-center gap-3">
            <li class="nav-item">
              <button
                class="btn btn-outline-dark btn-sm px-3 rounded-pill"
                data-bs-toggle="modal"
                data-bs-target="#createPostModal"
              >
                New Post
              </button>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Login</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div style="height: 72px"></div>

    <main class="page-container">{% block content %}{% endblock %}</main>

    <footer class="footer">
      © {{ 2025 }} FastAPI Blog · Built with FastAPI & Bootstrap
    </footer>

    <!-- Create Post Modal -->
    <div class="modal fade" id="createPostModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">New Post</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="createPostForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" name="title" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea
                  class="form-control"
                  name="content"
                  rows="5"
                  required
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Post</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Success</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p id="successMessage"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">Error</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p id="errorMessage"></p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Create Post Form Handler -->
    <script type="module">
      import {
        getErrorMessage,
        hideModal,
        showModal,
      } from "/static/js/utils.js";

      const createForm = document.getElementById("createPostForm");

      if (createForm) {
        createForm.addEventListener("submit", async (event) => {
          event.preventDefault();

          const formData = new FormData(createForm);
          const postData = Object.fromEntries(formData.entries());
          postData.user_id = 1;

          try {
            const response = await fetch("/api/posts", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(postData),
            });

            if (response.ok) {
              const data = await response.json();
              document.getElementById("successMessage").textContent =
                `Post "${data.title}" created successfully!`;

              hideModal("createPostModal");
              showModal("successModal");

              createForm.reset();

              document.getElementById("successModal").addEventListener(
                "hidden.bs.modal",
                () => {
                  window.location.reload();
                },
                { once: true },
              );
            } else {
              const error = await response.json();
              document.getElementById("errorMessage").textContent =
                getErrorMessage(error);

              hideModal("createPostModal");
              showModal("errorModal");
            }
          } catch {
            document.getElementById("errorMessage").textContent =
              "Network error. Please try again.";
            showModal("errorModal");
          }
        });
      }
    </script>

    {% block scripts %}{% endblock %}
  </body>
</html>
