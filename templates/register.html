{% extends "layout.html" %} {% block title %}Register · FastAPI Blog{% endblock
%} {% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title mb-4 text-center">Create Account</h2>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          class="form-control form-control-lg"
          id="username"
          name="username"
          required
          minlength="1"
          maxlength="50"
        />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          class="form-control form-control-lg"
          id="email"
          name="email"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control form-control-lg"
          id="password"
          name="password"
          required
          minlength="8"
        />
        <div class="form-text">Must be at least 8 characters.</div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
          type="password"
          class="form-control form-control-lg"
          id="confirmPassword"
          name="confirmPassword"
          required
          minlength="8"
        />
        <div id="passwordError" class="text-danger small mt-1 d-none">
          Passwords do not match.
        </div>
      </div>

      <button type="submit" class="btn btn-dark w-100 rounded-pill py-2">
        Register
      </button>
    </form>

    <p class="mt-4 text-center text-muted">
      Already have an account?
      <a
        href="{{ url_for('login_page') }}"
        class="fw-medium text-decoration-none"
      >
        Login here
      </a>
    </p>
  </div>
</div>
{% endblock content %} {% block scripts %}
<script type="module">
  import { getErrorMessage, showModal } from "/static/js/utils.js";

  const registerForm = document.getElementById("registerForm");
  const passwordInput = document.getElementById("password");
  const confirmPasswordInput = document.getElementById("confirmPassword");
  const passwordError = document.getElementById("passwordError");

  if (confirmPasswordInput) {
    confirmPasswordInput.addEventListener("input", () => {
      if (passwordInput.value !== confirmPasswordInput.value) {
        passwordError.classList.remove("d-none");
        confirmPasswordInput.setCustomValidity("Passwords do not match");
      } else {
        passwordError.classList.add("d-none");
        confirmPasswordInput.setCustomValidity("");
      }
    });
  }

  if (registerForm) {
    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (passwordInput.value !== confirmPasswordInput.value) {
        passwordError.classList.remove("d-none");
        return;
      }

      const formData = new FormData(registerForm);
      const userData = {
        username: formData.get("username"),
        email: formData.get("email"),
        password: formData.get("password"),
      };

      try {
        const response = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(userData),
        });

        if (response.ok) {
          document.getElementById("successMessage").textContent =
            "Account created successfully! Please login.";
          showModal("successModal");

          document.getElementById("successModal").addEventListener(
            "hidden.bs.modal",
            () => {
              window.location.href = "/login";
            },
            { once: true },
          );
        } else {
          const error = await response.json();
          document.getElementById("errorMessage").textContent =
            getErrorMessage(error);
          showModal("errorModal");
        }
      } catch {
        document.getElementById("errorMessage").textContent =
          "Network error. Please check your connection and try again.";
        showModal("errorModal");
      }
    });
  }
</script>
{% endblock scripts %}
